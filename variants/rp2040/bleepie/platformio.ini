[env:bleepie]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = rp2040
custom_meshtastic_display_name = Bleepie (RP2040-Tiny + Ra-01SH)

extends = rp2040_base
board = rpipico
upload_protocol = picotool
build_flags =
  ${rp2040_base.build_flags}
  -D PRIVATE_HW
  -D BLEEPIE_MESHTASTIC
  # Headless board: no I2C peripherals, no screen, no inputs, no GPS. This is the
  # known-good companion exclude set for MESHTASTIC_EXCLUDE_I2C on the arduino
  # path (mirrors heltec_wireless_bridge). We deliberately KEEP:
  #   - EXTERNALNOTIFICATION (drives our buzzer on GPIO15)
  #   - POWER_FSM (leave power state machine intact)
  #   - NeoPixel/ambient lighting (GPIO/PIO, not gated by these)
  # EXCLUDE_SERIAL also frees the SerialModule so it can't grab our Serial1
  # badge UART (GPIO28/29).
  -D MESHTASTIC_EXCLUDE_I2C
  -D MESHTASTIC_EXCLUDE_SCREEN
  -D MESHTASTIC_EXCLUDE_INPUTBROKER
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES
  -D MESHTASTIC_EXCLUDE_GPS
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER
  -D MESHTASTIC_EXCLUDE_SERIAL
  -D MESHTASTIC_EXCLUDE_WAYPOINT
  -I variants/rp2040/bleepie
  -D DEBUG_RP2040_PORT=Serial
# Append our badge-app embed step to Meshtastic's base pre-scripts (don't clobber).
extra_scripts =
  ${env.extra_scripts}
  pre:variants/rp2040/bleepie/embed_badge_app.py
debug_build_flags = ${rp2040_base.build_flags}, -g
debug_tool = cmsis-dap
